<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgileBoard • Interactive Scrum Retro Whiteboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: '#07090E',
                        canvas: '#04060A',
                        card: '#0B0F17',
                        amber: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Caveat:wght@600;700&display=swap');
        
        * {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
        }

        .handwritten {
            font-family: 'Caveat', cursive;
        }

        .board-bg {
            background-color: #07090E;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px);
            background-size: 28px 28px;
        }

        /* Stageshow: modern tactile sticky notes with soft elevation */
        .sticky-note {
            box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.4), 0 2px 6px -2px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sticky-note:hover {
            transform: translateY(-3px) scale(1.015);
            box-shadow: 0 16px 28px -6px rgba(0, 0, 0, 0.5), 0 6px 12px -3px rgba(0, 0, 0, 0.3);
        }

        .sticky-yellow { background-color: #fef9c3; color: #713f12; border-top: 6px solid #eab308; }
        .sticky-green  { background-color: #dcfce7; color: #14532d; border-top: 6px solid #22c55e; }
        .sticky-pink   { background-color: #fce7f3; color: #831843; border-top: 6px solid #ec4899; }
        .sticky-blue   { background-color: #e0f2fe; color: #0c4a6e; border-top: 6px solid #0ea5e9; }
        .sticky-purple { background-color: #f3e8ff; color: #581c87; border-top: 6px solid #a855f7; }
        .sticky-orange { background-color: #ffedd5; color: #7c2d12; border-top: 6px solid #f97316; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #07090E;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-[#07090E] text-slate-100 min-h-screen flex flex-col overflow-hidden">

    <!-- Top Toolbar (Spacious 80px Bar with 44px Touch Targets) -->
    <header class="h-20 bg-[#07090E]/95 backdrop-blur-xl border-b border-white/[0.08] px-4 sm:px-6 flex items-center justify-between z-30 transition-all">
        <div class="flex items-center space-x-3 sm:space-x-4">
            <a href="index.html" class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white border border-white/10 transition min-h-[44px] min-w-[44px] flex items-center justify-center shadow-sm" title="Back to Command Hub">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </a>
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-400 to-rose-500 flex items-center justify-center text-white shadow-md shadow-amber-500/20">
                    <i data-lucide="layout" class="w-5 h-5 text-black"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base sm:text-lg text-white flex items-center gap-2">
                        AgileBoard
                        <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30 font-mono">Retro Studio</span>
                    </h1>
                    <p class="text-xs text-slate-400 hidden sm:block">Facilitation Sandbox • Designed by Balaji Palani</p>
                </div>
            </div>
        </div>

        <!-- Template Selector -->
        <div class="hidden md:flex items-center space-x-2 bg-white/[0.03] p-1.5 rounded-xl border border-white/10 min-h-[44px]">
            <span class="text-xs text-slate-400 px-2 font-medium">Framework:</span>
            <select id="templateSelector" onchange="loadTemplate(this.value)" class="bg-black/60 text-xs font-semibold text-white px-3.5 py-1.5 rounded-lg border border-white/10 focus:outline-none focus:border-amber-400 cursor-pointer min-h-[36px]">
                <option value="wentWell">Went Well / Didn't / Actions</option>
                <option value="madSadGlad">Mad / Sad / Glad</option>
                <option value="startStopContinue">Start / Stop / Continue</option>
                <option value="sailboat">Sailboat Retro (Wind & Anchors)</option>
                <option value="fourLs">The 4 Ls (Liked, Learned, Lacked, Longed)</option>
                <option value="leanCoffee">Lean Coffee / Kanban</option>
            </select>
        </div>

        <!-- Actions & Retro Timer -->
        <div class="flex items-center space-x-2 sm:space-x-3">
            <!-- Timer Widget -->
            <div class="flex items-center bg-white/5 rounded-xl px-3.5 py-2 border border-white/10 text-xs space-x-2.5 min-h-[44px]">
                <i data-lucide="timer" class="w-4 h-4 text-amber-400"></i>
                <span id="timerDisplay" class="font-mono font-bold text-white text-sm">05:00</span>
                <button onclick="toggleTimer()" id="timerToggleBtn" class="p-1 hover:text-amber-400 transition" title="Start/Pause">
                    <i data-lucide="play" class="w-4 h-4" id="timerIcon"></i>
                </button>
                <button onclick="resetTimer()" class="p-1 hover:text-slate-300 transition" title="Reset">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Add Note Button (44px touch target) -->
            <button onclick="addStickyNotePrompt()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-black font-extrabold text-xs shadow-md shadow-amber-500/20 transition active:scale-95 min-h-[44px]">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Add Sticky Note</span>
            </button>

            <!-- Export Board -->
            <button onclick="exportBoardSummary()" class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 border border-white/10 transition min-h-[44px] min-w-[44px] flex items-center justify-center shadow-sm" title="Export Retro Summary">
                <i data-lucide="download" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- Sub-header Toolbar (Palette & Filters) -->
    <div class="bg-black/40 border-b border-white/[0.08] px-4 sm:px-6 py-2.5 flex items-center justify-between text-xs text-slate-400 z-20">
        <div class="flex items-center space-x-3">
            <span class="font-medium text-slate-300">Sticky Note Color:</span>
            <div class="flex items-center space-x-2">
                <button onclick="setCurrentColor('yellow')" class="w-6 h-6 rounded-full bg-yellow-300 border-2 border-slate-700 focus:ring-2 focus:ring-white transition" title="Yellow"></button>
                <button onclick="setCurrentColor('green')" class="w-6 h-6 rounded-full bg-emerald-300 border-2 border-slate-700 focus:ring-2 focus:ring-white transition" title="Green"></button>
                <button onclick="setCurrentColor('pink')" class="w-6 h-6 rounded-full bg-pink-300 border-2 border-slate-700 focus:ring-2 focus:ring-white transition" title="Pink"></button>
                <button onclick="setCurrentColor('blue')" class="w-6 h-6 rounded-full bg-sky-300 border-2 border-slate-700 focus:ring-2 focus:ring-white transition" title="Blue"></button>
                <button onclick="setCurrentColor('purple')" class="w-6 h-6 rounded-full bg-purple-300 border-2 border-slate-700 focus:ring-2 focus:ring-white transition" title="Purple"></button>
                <button onclick="setCurrentColor('orange')" class="w-6 h-6 rounded-full bg-orange-300 border-2 border-slate-700 focus:ring-2 focus:ring-white transition" title="Orange"></button>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <span class="hidden sm:inline text-slate-500">💡 Drag notes across columns or double-click to edit text</span>
            <button onclick="clearAllNotes()" class="text-rose-400 hover:text-rose-300 transition font-semibold">Clear Board</button>
        </div>
    </div>

    <!-- Main Infinite Whiteboard Area (Spacious Columns & Ample Margins) -->
    <main class="flex-grow board-bg p-6 sm:p-8 overflow-x-auto overflow-y-auto custom-scrollbar">
        <div id="columnsContainer" class="flex items-start space-x-8 min-w-max pb-20">
            <!-- Dynamic columns loaded via JS -->
        </div>
    </main>

    <!-- New Note Modal -->
    <div id="noteModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#0B0F17] border border-white/15 rounded-2xl max-w-md w-full p-6 sm:p-8 space-y-5 shadow-2xl">
            <div class="flex items-center justify-between border-b border-white/10 pb-4">
                <h3 class="font-extrabold text-white text-lg tracking-tight">New Sticky Note</h3>
                <button onclick="closeNoteModal()" class="text-slate-400 hover:text-white p-2 rounded-xl hover:bg-white/10 transition min-h-[44px] min-w-[44px] flex items-center justify-center">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="space-y-4 text-xs">
                <div>
                    <label class="block font-semibold text-slate-300 mb-1.5">Target Column</label>
                    <select id="modalColumnSelect" class="w-full bg-black/60 text-slate-200 text-xs px-3.5 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:border-amber-400 min-h-[44px]"></select>
                </div>
                <div>
                    <label class="block font-semibold text-slate-300 mb-1.5">Note Color</label>
                    <div class="flex items-center space-x-3 pt-1">
                        <label class="cursor-pointer"><input type="radio" name="modalColor" value="yellow" checked class="hidden peer"><span class="w-7 h-7 rounded-full bg-yellow-300 block peer-checked:ring-2 peer-checked:ring-white"></span></label>
                        <label class="cursor-pointer"><input type="radio" name="modalColor" value="green" class="hidden peer"><span class="w-7 h-7 rounded-full bg-emerald-300 block peer-checked:ring-2 peer-checked:ring-white"></span></label>
                        <label class="cursor-pointer"><input type="radio" name="modalColor" value="pink" class="hidden peer"><span class="w-7 h-7 rounded-full bg-pink-300 block peer-checked:ring-2 peer-checked:ring-white"></span></label>
                        <label class="cursor-pointer"><input type="radio" name="modalColor" value="blue" class="hidden peer"><span class="w-7 h-7 rounded-full bg-sky-300 block peer-checked:ring-2 peer-checked:ring-white"></span></label>
                        <label class="cursor-pointer"><input type="radio" name="modalColor" value="purple" class="hidden peer"><span class="w-7 h-7 rounded-full bg-purple-300 block peer-checked:ring-2 peer-checked:ring-white"></span></label>
                        <label class="cursor-pointer"><input type="radio" name="modalColor" value="orange" class="hidden peer"><span class="w-7 h-7 rounded-full bg-orange-300 block peer-checked:ring-2 peer-checked:ring-white"></span></label>
                    </div>
                </div>
                <div>
                    <label class="block font-semibold text-slate-300 mb-1.5">Content</label>
                    <textarea id="modalNoteText" rows="4" placeholder="Write retro feedback, win, blocker, or action item..." class="w-full bg-black/60 text-slate-200 text-sm p-3.5 rounded-xl border border-white/10 focus:outline-none focus:border-amber-400"></textarea>
                </div>
                <div>
                    <label class="block font-semibold text-slate-300 mb-1.5">Author / Squad Member</label>
                    <input type="text" id="modalNoteAuthor" placeholder="e.g. Balaji, Dev Lead, QA" value="Balaji" class="w-full bg-black/60 text-slate-200 text-xs px-3.5 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:border-amber-400 min-h-[44px]">
                </div>
            </div>

            <div class="flex items-center justify-end space-x-3 pt-3 border-t border-white/10">
                <button onclick="closeNoteModal()" class="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition min-h-[44px]">Cancel</button>
                <button onclick="submitNewNote()" class="px-5 py-2.5 rounded-xl text-xs font-bold bg-amber-400 hover:bg-amber-300 text-black shadow-md shadow-amber-500/20 transition min-h-[44px]">Create Note</button>
            </div>
        </div>
    </div>

    <!-- Export Summary Modal -->
    <div id="exportModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#0B0F17] border border-white/15 rounded-2xl max-w-xl w-full p-6 sm:p-8 space-y-5 shadow-2xl">
            <div class="flex items-center justify-between border-b border-white/10 pb-4">
                <h3 class="font-extrabold text-white text-lg tracking-tight">Sprint Retrospective Markdown Summary</h3>
                <button onclick="closeExportModal()" class="text-slate-400 hover:text-white p-2 rounded-xl hover:bg-white/10 transition min-h-[44px] min-w-[44px] flex items-center justify-center">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <textarea id="exportText" rows="12" readonly class="w-full bg-black/70 text-slate-300 font-mono text-xs p-4 rounded-xl border border-white/10 custom-scrollbar"></textarea>
            <div class="flex justify-end space-x-3 pt-2">
                <button onclick="copyExportText()" class="px-4 py-2.5 rounded-xl text-xs font-bold bg-cyan-400 hover:bg-cyan-300 text-black transition min-h-[44px]">Copy Summary</button>
                <button onclick="closeExportModal()" class="px-4 py-2.5 rounded-xl text-xs font-semibold bg-white/10 text-slate-300 hover:text-white transition min-h-[44px]">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Preset Retro Templates
        const templates = {
            wentWell: {
                title: "Classic Sprint Retrospective",
                columns: [
                    { id: "col1", title: "🎉 What Went Well", color: "emerald", icon: "smile" },
                    { id: "col2", title: "⚠️ What Didn't Go Well", color: "rose", icon: "alert-triangle" },
                    { id: "col3", title: "🚀 Action Items / Commitments", color: "sky", icon: "check-circle-2" }
                ],
                sampleNotes: [
                    { colId: "col1", text: "Finished 3 critical API epics 2 days ahead of sprint cadence!", color: "green", votes: 4, author: "Dev Squad" },
                    { colId: "col1", text: "Cross-functional refinement made user stories crystal clear with DoD.", color: "yellow", votes: 3, author: "Balaji" },
                    { colId: "col2", text: "Staging deployment pipeline timed out twice causing QA blocker.", color: "pink", votes: 5, author: "QA Lead" },
                    { colId: "col3", text: "Action: Setup automated slack alerting on staging build failures.", color: "blue", votes: 2, author: "DevOps" }
                ]
            },
            madSadGlad: {
                title: "Mad / Sad / Glad",
                columns: [
                    { id: "col1", title: "😡 Mad (Frustrations)", color: "rose", icon: "frown" },
                    { id: "col2", title: "😢 Sad (Disappointments)", color: "amber", icon: "meh" },
                    { id: "col3", title: "😃 Glad (Proud Moments)", color: "emerald", icon: "smile" }
                ],
                sampleNotes: [
                    { colId: "col1", text: "Scope creep injected on Day 7 of 10 without PO trade-off discussions.", color: "pink", votes: 6, author: "Sprint Pod" },
                    { colId: "col2", text: "Didn't have enough time for performance regression testing.", color: "orange", votes: 2, author: "QA" },
                    { colId: "col3", text: "Pair programming unblocked the complex token authentication logic!", color: "green", votes: 5, author: "Fullstack" }
                ]
            },
            startStopContinue: {
                title: "Start / Stop / Continue",
                columns: [
                    { id: "col1", title: "🟢 Start Doing", color: "emerald", icon: "play" },
                    { id: "col2", title: "🔴 Stop Doing", color: "rose", icon: "square" },
                    { id: "col3", title: "🔵 Continue Doing", color: "sky", icon: "refresh-cw" }
                ],
                sampleNotes: [
                    { colId: "col1", text: "Start: 10-minute async daily updates on Slack on non-critical days.", color: "green", votes: 3, author: "Engineering" },
                    { colId: "col2", text: "Stop: Scheduling ad-hoc meetings during the morning core focus hours.", color: "pink", votes: 7, author: "Team" },
                    { colId: "col3", text: "Continue: Demoing working software at every Sprint Review directly to stakeholders.", color: "blue", votes: 4, author: "PO" }
                ]
            },
            sailboat: {
                title: "The Sailboat Retrospective",
                columns: [
                    { id: "col1", title: "💨 Wind (Propelling us forward)", color: "sky", icon: "wind" },
                    { id: "col2", title: "⚓ Anchors (Holding us back)", color: "amber", icon: "anchor" },
                    { id: "col3", title: "🪨 Rocks / Risks (Future dangers)", color: "rose", icon: "alert-octagon" },
                    { id: "col4", title: "🏝️ Island (Sprint Goal / Vision)", color: "emerald", icon: "compass" }
                ],
                sampleNotes: [
                    { colId: "col1", text: "Strong team collaboration & proactive PR reviews within 2 hours.", color: "blue", votes: 3, author: "Balaji" },
                    { colId: "col2", text: "Third-party sandbox API was down for 36 hours.", color: "orange", votes: 4, author: "Backend" },
                    { colId: "col3", text: "Upcoming holiday season may compress velocity next sprint.", color: "pink", votes: 5, author: "Delivery Lead" },
                    { colId: "col4", text: "Deliver unified customer onboarding portal for Q4 release.", color: "green", votes: 6, author: "Product" }
                ]
            },
            fourLs: {
                title: "The 4 Ls Retrospective",
                columns: [
                    { id: "col1", title: "❤️ Liked", color: "emerald", icon: "heart" },
                    { id: "col2", title: "🧠 Learned", color: "sky", icon: "book-open" },
                    { id: "col3", title: "❌ Lacked", color: "amber", icon: "slash" },
                    { id: "col4", title: "✨ Longed For", color: "purple", icon: "star" }
                ],
                sampleNotes: [
                    { colId: "col1", text: "Loved the clean microservice refactoring.", color: "green", votes: 3, author: "Dev" },
                    { colId: "col2", text: "Learned how to tune Postgres database indexes for high concurrency.", color: "blue", votes: 4, author: "DBA" },
                    { colId: "col3", text: "Lacked clarity on payment gateway error codes.", color: "yellow", votes: 2, author: "Frontend" },
                    { colId: "col4", text: "Longed for earlier UX wireframes before sprint kickoff.", color: "purple", votes: 5, author: "Team" }
                ]
            },
            leanCoffee: {
                title: "Lean Coffee / Kanban Retro",
                columns: [
                    { id: "col1", title: "📋 Topics To Discuss", color: "slate", icon: "list" },
                    { id: "col2", title: "💬 Discussing (Timeboxed)", color: "amber", icon: "message-square" },
                    { id: "col3", title: "✅ Discussed", color: "emerald", icon: "check" },
                    { id: "col4", title: "📌 Action Items", color: "sky", icon: "flag" }
                ],
                sampleNotes: [
                    { colId: "col1", text: "How do we reduce bug bounce rate between QA and Dev?", color: "yellow", votes: 5, author: "Team" },
                    { colId: "col2", text: "Definition of Ready: what makes a story ready for Sprint backlog?", color: "orange", votes: 4, author: "Balaji" },
                    { colId: "col4", text: "Add mandatory acceptance criteria checklist to Jira ticket template.", color: "blue", votes: 3, author: "Scrum Master" }
                ]
            }
        };

        let currentTemplateKey = localStorage.getItem('agileboard_template') || 'wentWell';
        let currentColor = 'yellow';
        let notes = JSON.parse(localStorage.getItem('agileboard_notes')) || null;

        // Render Board
        function initBoard() {
            const tmpl = templates[currentTemplateKey] || templates.wentWell;
            const container = document.getElementById('columnsContainer');
            container.innerHTML = '';

            // Update modal select dropdown
            const modalSelect = document.getElementById('modalColumnSelect');
            modalSelect.innerHTML = '';

            tmpl.columns.forEach(col => {
                modalSelect.innerHTML += `<option value="${col.id}">${col.title}</option>`;

                const colEl = document.createElement('div');
                colEl.className = 'w-88 sm:w-[380px] flex-shrink-0 flex flex-col bg-[#0B0F17]/90 rounded-2xl border border-white/10 p-5 min-h-[72vh] shadow-xl backdrop-blur-md transition-all';
                colEl.dataset.colId = col.id;
                colEl.ondragover = handleDragOver;
                colEl.ondrop = handleDrop;

                colEl.innerHTML = `
                    <div class="flex items-center justify-between pb-3.5 border-b border-white/10 mb-4 px-1">
                        <div class="flex items-center space-x-2.5">
                            <span class="font-extrabold text-sm text-white">${col.title}</span>
                            <span id="count-${col.id}" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-white/5 text-slate-300 border border-white/10 font-mono">0</span>
                        </div>
                        <button onclick="openNoteModalForCol('${col.id}')" class="p-2 rounded-xl hover:bg-white/10 text-slate-400 hover:text-white transition min-h-[36px] min-w-[36px] flex items-center justify-center" title="Add note here">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div id="notes-${col.id}" class="flex-grow space-y-4 min-h-[320px]"></div>
                `;
                container.appendChild(colEl);
            });

            // Initialize default notes if none stored
            if (!notes) {
                notes = tmpl.sampleNotes.map((n, idx) => ({
                    id: 'note-' + Date.now() + '-' + idx,
                    ...n
                }));
                saveNotes();
            }

            renderAllNotes();
            if (window.lucide && typeof lucide.createIcons === 'function') {
                try { lucide.createIcons(); } catch (e) {}
            }
        }

        function renderAllNotes() {
            const tmpl = templates[currentTemplateKey];
            tmpl.columns.forEach(col => {
                const colNotes = notes.filter(n => n.colId === col.id);
                const colContainer = document.getElementById(`notes-${col.id}`);
                const countBadge = document.getElementById(`count-${col.id}`);
                if (countBadge) countBadge.innerText = colNotes.length;
                if (colContainer) colContainer.innerHTML = '';

                colNotes.forEach(note => {
                    const card = createNoteCard(note);
                    if (colContainer) colContainer.appendChild(card);
                });
            });
            if (window.lucide && typeof lucide.createIcons === 'function') {
                try { lucide.createIcons(); } catch (e) {}
            }
        }

        function createNoteCard(note) {
            const card = document.createElement('div');
            card.className = `sticky-note sticky-${note.color || 'yellow'} p-4 rounded-xl cursor-grab relative text-xs leading-relaxed group`;
            card.id = note.id;
            card.draggable = true;
            card.ondragstart = handleDragStart;

            card.innerHTML = `
                <div class="flex items-start justify-between gap-2 mb-2">
                    <span class="text-[10px] font-bold uppercase tracking-wider opacity-75 font-mono">${note.author || 'Member'}</span>
                    <button onclick="deleteNote('${note.id}')" class="opacity-0 group-hover:opacity-100 hover:text-rose-700 transition" title="Delete note">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
                <div contenteditable="true" onblur="updateNoteContent('${note.id}', this.innerText)" class="font-medium whitespace-pre-wrap outline-none leading-relaxed">${note.text}</div>
                <div class="flex items-center justify-between mt-3 pt-2.5 border-t border-black/10">
                    <div class="flex items-center space-x-1.5">
                        <button onclick="upvoteNote('${note.id}')" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-black/10 hover:bg-black/20 text-[11px] font-bold transition">
                            <span>👍</span>
                            <span>${note.votes || 0}</span>
                        </button>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <button onclick="changeNoteColor('${note.id}', 'yellow')" class="w-3.5 h-3.5 rounded-full bg-yellow-400"></button>
                        <button onclick="changeNoteColor('${note.id}', 'green')" class="w-3.5 h-3.5 rounded-full bg-emerald-400"></button>
                        <button onclick="changeNoteColor('${note.id}', 'pink')" class="w-3.5 h-3.5 rounded-full bg-pink-400"></button>
                        <button onclick="changeNoteColor('${note.id}', 'blue')" class="w-3.5 h-3.5 rounded-full bg-sky-400"></button>
                    </div>
                </div>
            `;
            return card;
        }

        // Drag and Drop Logic
        let draggedNoteId = null;

        function handleDragStart(e) {
            draggedNoteId = e.target.id;
            e.dataTransfer.setData('text/plain', e.target.id);
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDrop(e) {
            e.preventDefault();
            const col = e.currentTarget;
            const targetColId = col.dataset.colId;
            if (draggedNoteId && targetColId) {
                const note = notes.find(n => n.id === draggedNoteId);
                if (note) {
                    note.colId = targetColId;
                    saveNotes();
                    renderAllNotes();
                }
            }
        }

        // Note Management
        function openNoteModalForCol(colId) {
            document.getElementById('modalColumnSelect').value = colId;
            document.getElementById('modalNoteText').value = '';
            document.getElementById('noteModal').classList.remove('hidden');
        }

        function addStickyNotePrompt() {
            const tmpl = templates[currentTemplateKey];
            openNoteModalForCol(tmpl.columns[0].id);
        }

        function closeNoteModal() {
            document.getElementById('noteModal').classList.add('hidden');
        }

        function submitNewNote() {
            const colId = document.getElementById('modalColumnSelect').value;
            const text = document.getElementById('modalNoteText').value.trim();
            const author = document.getElementById('modalNoteAuthor').value.trim() || 'Balaji';
            const color = document.querySelector('input[name="modalColor"]:checked').value;

            if (!text) return;

            const newNote = {
                id: 'note-' + Date.now(),
                colId: colId,
                text: text,
                color: color,
                votes: 1,
                author: author
            };

            notes.push(newNote);
            saveNotes();
            renderAllNotes();
            closeNoteModal();
        }

        function updateNoteContent(noteId, text) {
            const note = notes.find(n => n.id === noteId);
            if (note) {
                note.text = text;
                saveNotes();
            }
        }

        function upvoteNote(noteId) {
            const note = notes.find(n => n.id === noteId);
            if (note) {
                note.votes = (note.votes || 0) + 1;
                saveNotes();
                renderAllNotes();
            }
        }

        function changeNoteColor(noteId, color) {
            const note = notes.find(n => n.id === noteId);
            if (note) {
                note.color = color;
                saveNotes();
                renderAllNotes();
            }
        }

        function deleteNote(noteId) {
            notes = notes.filter(n => n.id !== noteId);
            saveNotes();
            renderAllNotes();
        }

        function clearAllNotes() {
            if (confirm("Clear all sticky notes from this board?")) {
                notes = [];
                saveNotes();
                renderAllNotes();
            }
        }

        function saveNotes() {
            localStorage.setItem('agileboard_notes', JSON.stringify(notes));
        }

        function loadTemplate(key) {
            currentTemplateKey = key;
            localStorage.setItem('agileboard_template', key);
            notes = null; // load sample notes for new template
            initBoard();
        }

        function setCurrentColor(c) {
            currentColor = c;
        }

        // Export Function
        function exportBoardSummary() {
            const tmpl = templates[currentTemplateKey];
            let summary = `# ${tmpl.title} Summary\nGenerated by AgileBoard (Balaji Palani)\nDate: ${new Date().toLocaleDateString()}\n\n`;

            tmpl.columns.forEach(col => {
                summary += `## ${col.title}\n`;
                const colNotes = notes.filter(n => n.colId === col.id);
                if (colNotes.length === 0) {
                    summary += `(No notes)\n\n`;
                } else {
                    colNotes.forEach(n => {
                        summary += `- [${n.votes} votes] (${n.author}): ${n.text}\n`;
                    });
                    summary += `\n`;
                }
            });

            document.getElementById('exportText').value = summary;
            document.getElementById('exportModal').classList.remove('hidden');
        }

        function closeExportModal() {
            document.getElementById('exportModal').classList.add('hidden');
        }

        function copyExportText() {
            const t = document.getElementById('exportText').value;
            navigator.clipboard.writeText(t).then(() => {
                alert("Retro summary copied to clipboard! ✨");
            });
        }

        // Retro Countdown Timer Logic
        let timerSeconds = 300;
        let timerInterval = null;
        let isRunning = false;

        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            document.getElementById('timerDisplay').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            const icon = document.getElementById('timerIcon');
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                icon.setAttribute('data-lucide', 'play');
            } else {
                isRunning = true;
                icon.setAttribute('data-lucide', 'pause');
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;
                        icon.setAttribute('data-lucide', 'play');
                        alert("⏰ Time is up! Retrospective timebox concluded.");
                    }
                }, 1000);
            }
            if (window.lucide && typeof lucide.createIcons === 'function') {
                try { lucide.createIcons(); } catch (e) {}
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            timerSeconds = 300;
            updateTimerDisplay();
            const icon = document.getElementById('timerIcon');
            icon.setAttribute('data-lucide', 'play');
            if (window.lucide && typeof lucide.createIcons === 'function') {
                try { lucide.createIcons(); } catch (e) {}
            }
        }

        // Initialize on load
        document.getElementById('templateSelector').value = currentTemplateKey;
        initBoard();
    </script>
</body>
</html>
